<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Chess</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<header>
    <h1>♔ Chess</h1>
</header>

<section class="hero">
    <h2>Play Chess Online</h2>
    <p>Challenge your friends or practise your skills.</p>
</section>

<div class="game-container">

    <div id="board"></div>

    <aside class="sidebar">

        <button>New Game</button>
        <button>Undo Move</button>
        <button>Flip Board</button>

        <div class="status">
            <h3>Game Status</h3>
            <p>White to move</p>
        </div>

    </aside>

</div>

<script src="/static/board.js"></script>

</body>
</html>
